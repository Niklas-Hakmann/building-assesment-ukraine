# Local stack: Mosquitto broker + mock accelerometer sensors + PostgreSQL.
#
#   docker compose up --build
#   docker compose exec mosquitto mosquitto_sub -t 'sensors/#' -v   # watch the traffic
#   docker compose exec postgres psql -U building -d building_assessment   # SQL shell
#   JDBC from the host: jdbc:postgresql://localhost:5432/building_assessmentpostgres
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: building_assessment
      POSTGRES_USER: building
      POSTGRES_PASSWORD: building
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

  sensor-simulator:
    build: ./simulators
    container_name: sensor-simulator
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SENSOR_CONFIG: /app/sensors.json
    volumes:
      - ./simulators/sensors.json:/app/sensors.json:ro
    restart: unless-stopped

volumes:
  postgres-data:
