    [env:seeed_xiao_rp2040]
; The official "raspberrypi" platform only lists pico/nanorp2040connect.
; This community fork tracks earlephilhower/arduino-pico's full boards.json,
; which includes seeed_xiao_rp2040.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MMA8451 Library
    adafruit/Adafruit Unified Sensor
